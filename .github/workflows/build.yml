name: Build and test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Debug build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: "basic"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check string parity and Fastlane metadata
        run: |
          ./scripts/check-string-parity.py
          python3 ./scripts/check-fastlane-metadata.py

      # Robolectric downloads its android-all jars itself at test time (not
      # through Gradle) into ~/.m2/repository. Caching them means a throttled
      # Maven Central only matters until one run has succeeded.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Build, lint, and test
        # Maven Central answers large downloads with HTTP 429 when the runner
        # pool is busy. Gradle's default retries (3, starting at 1 s) give up
        # too fast, so back off longer. Robolectric's own fetcher ignores those
        # settings, so the unit tests get one delayed retry on top.
        run: |
          GRADLE_RETRY="-Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=5000"
          ./gradlew assembleDebug lintDebug $GRADLE_RETRY
          ./gradlew testDebugUnitTest $GRADLE_RETRY || {
            echo "::warning::Unit tests failed; retrying once in 90 s in case Robolectric downloads were throttled."
            sleep 90
            ./gradlew testDebugUnitTest $GRADLE_RETRY
          }
